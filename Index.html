<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Arena</title>
<style>
:root{--bg:#06080f;--card:#0f1626;--line:#1e2b47;--tx:#e8edf7;--mut:#8593b3;--g:#39ff88;--r:#ff3b5c;--c:#22d3ee;--y:#ffd23f;--p:#a855f7;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 80% -10%,#1a1040 0,transparent 60%),radial-gradient(700px 400px at 0 100%,#062b3a 0,transparent 60%),var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:14px;min-height:100vh}
.big #app{max-width:1000px}
h1{font-size:34px;margin:6px 0;letter-spacing:2px;text-align:center;font-family:Consolas,monospace;background:linear-gradient(90deg,var(--c),var(--g),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;animation:gl 3s infinite}
@keyframes gl{0%,92%,100%{transform:none}94%{transform:translateX(3px) skewX(6deg)}96%{transform:translateX(-3px)}}
.sub{text-align:center;color:var(--mut);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0a1020;color:var(--tx);font-size:17px;margin:6px 0;font-family:inherit}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-size:18px;font-weight:700;color:#04110a;background:linear-gradient(90deg,var(--g),var(--c));cursor:pointer;font-family:inherit}
.btn.alt{background:transparent;color:var(--c);border:1px solid var(--c)}
.btn.red{background:linear-gradient(90deg,var(--r),#ff7a3b);color:#fff}
.btn:disabled{opacity:.4}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.av{font-size:28px;padding:6px 9px;border-radius:12px;border:2px solid var(--line);cursor:pointer}
.av.on{border-color:var(--g);box-shadow:0 0 12px var(--g)}
.hud{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chip{padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:#0a1020;font-weight:700;font-size:15px;white-space:nowrap}
.sc{color:var(--y);font-family:Consolas,monospace;font-size:22px;font-weight:800}
.bar{height:8px;border-radius:6px;background:#0a1020;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--g),var(--y),var(--r));transition:width .1s linear}
.q{font-size:20px;line-height:1.5;direction:ltr;text-align:left;font-weight:600;margin:12px 0}
.ans{display:block;width:100%;direction:ltr;text-align:left;padding:14px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:#0a1020;color:var(--tx);font-size:17px;cursor:pointer}
.ans:active{transform:scale(.98)}
.ans.ok{background:#0d4a2a;border-color:var(--g)}.ans.bad{background:#521222;border-color:var(--r)}
.lvl{font-family:Consolas,monospace;color:var(--p);font-weight:800;letter-spacing:1px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#0a1020;margin:6px 0;border:1px solid transparent}
.row.me{border-color:var(--c)}.row b{flex:1}.row .n{width:26px;color:var(--mut);font-family:Consolas,monospace}
.row .s{font-family:Consolas,monospace;color:var(--y);font-weight:800}
.hk{padding:7px 12px;border-radius:10px;border:0;background:var(--r);color:#fff;font-weight:800;font-family:inherit}
.feed{font-size:14px;color:var(--mut);min-height:20px}.feed div{padding:3px 0}.feed .x{color:var(--r)}.feed .b{color:var(--y)}
.ov{position:fixed;inset:0;background:rgba(3,5,10,.94);z-index:20;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.fl{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:900;padding:30px;pointer-events:none;animation:fl 2.2s forwards}
.fl.r{background:rgba(255,30,70,.88)}.fl.g{background:rgba(20,200,110,.85);color:#031}.fl.y{background:rgba(255,200,40,.88);color:#221}
@keyframes fl{0%{opacity:0;transform:scale(1.2)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.code{font-family:Consolas,monospace;font-size:64px;letter-spacing:10px;text-align:center;color:var(--g);direction:ltr}
.pl{display:inline-block;margin:4px;padding:8px 12px;border-radius:20px;background:#0a1020;border:1px solid var(--line)}
.tag{color:var(--y);font-weight:800}.err{color:var(--r);text-align:center}
</style><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><div id="app"></div>
<script>
const Q=[
[1,"Which is an example of a web application?",["A video player program installed on a device","An online map website","A desktop calculator application","An image editing program"],1],
[1,"The screen component that users see directly is called the:",["Backend","Database","Frontend","Server"],2],
[1,"The part responsible for server-side processing that users do NOT see is the:",["Frontend","Backend","Browser","Screen"],1],
[1,"A system that organizes, stores, and manages data is the:",["Frontend","Backend","Database","Browser"],2],
[1,"A web application is usually built from:",["One layer","Two layers","Three layers that cooperate","Many separate programs"],2],
[1,"A web application requires dedicated software to be installed on your device.",["True","False"],1],
[2,"In a video-sharing site, selecting recommended videos and counting views is done by:",["Frontend","Backend","Database","Browser"],1],
[2,"In an SNS, storing post data and follow relationships is the job of the:",["Processing server","Frontend","Database","Backend"],2],
[2,"The timeline screen of an SNS belongs to the:",["Frontend","Backend","Database","Network"],0],
[2,"Stock checking and executing payment in an e-commerce site belong to the:",["Frontend","Database","Browser","Backend"],3],
[2,"Verifying login information is a function of the:",["Backend","Frontend","Screen","Search box"],0],
[2,"Order history in an e-commerce site is stored in the:",["Search screen","Backend","Database","User interface"],2],
[3,"A clinic booking page opens normally but NO free slots appear. Which tiers could have failed?",["Frontend only","Backend or Database","Browser only","Nothing failed"],1],
[3,"In a weather app, which job can the frontend NOT do on its own?",["Taking the city name","Displaying the result","Looking up the forecast data","Showing the search box"],2],
[3,"Which statement best describes the three-tier architecture?",["The frontend stores and manages data","The backend is what users interact with on the browser","Frontend, backend and database cooperate in response to user actions","The database displays screens to users"],2],
[3,"Controlling push notifications and determining the audience of a post is done by:",["Frontend","Timeline","Database","Backend"],3],
[3,"In a product search, who sends the search keywords to the database?",["Frontend directly","Backend","Browser","The user"],1],
[3,"Which is the correct order of a product search request?",["Frontend, Database, Backend, Frontend","Backend, Frontend, Database, Backend","Frontend, Backend, Database, Backend, Frontend","Database, Backend, Frontend"],2]
];
const LV=["","RECRUIT","HACKER","CONQUEROR"],AVS=["🥷","🦅","🐺","🦂","👾","🤖","🐉","🦈"],QT=15;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let off=0,N=()=>Date.now()+off,peer=null,conn=null,conns=[],synced=false,HP="cyberarena-v1-",db=null,scr="home",code="",isHost=false,room={},players={},hacks=[],joinT=0,me={id:"p"+Math.random().toString(36).slice(2,9),n:"",av:AVS[0],pts:0,st:0,hk:0,sh:0,ca:0},
order=[],qi=0,cur=null,t0=0,locked=false,lastLvl=0,seenH=new Set(),ticker=null,err="";
try{const s=localStorage.getItem("ca_name");if(s)me.n=s}catch(e){}
window.addEventListener("load",()=>{db=typeof Peer!=="undefined";if(!db)err="لازم نت شغال عشان اللعبة تفتح";render()});
function calc(){const S={};for(const id in players){const p=players[id];S[id]={id,n:p.n,av:p.av,sc:p.pts||0,hl:p.hk||0,sl:p.sh||0}}
for(const h of hacks){if(S[h.from])S[h.from].hl--;if(h.blk){if(S[h.to])S[h.to].sl--}else{if(S[h.from])S[h.from].sc+=h.amt;if(S[h.to])S[h.to].sc-=h.amt}}
return Object.values(S).map(x=>({...x,sc:Math.max(0,x.sc),hl:Math.max(0,x.hl),sl:Math.max(0,x.sl)})).sort((a,b)=>b.sc-a.sc)}
function feedHtml(){return hacks.slice().sort((a,b)=>b.t-a.t).slice(0,isHost?7:3).map(h=>h.blk?`<div class="b">🛡 ${esc(h.tn)} صدّ هجوم ${esc(h.fn)}</div>`:`<div class="x">🔓 ${esc(h.fn)} هكّر ${esc(h.tn)} وخطف <b>${h.amt}</b> نقطة</div>`).join("")||"<div>لسه مفيش هجمات… 👀</div>"}
function lbHtml(n,hackable){const L=calc();const m=L.find(x=>x.id===me.id);return L.slice(0,n||50).map((p,i)=>`<div class="row ${p.id===me.id?"me":""}"><span class="n">${i+1}</span><span style="font-size:24px">${p.av}</span><b>${esc(p.n)} ${p.sl>0?"🛡":""}</b><span class="s">${p.sc}</span>${hackable&&p.id!==me.id?`<button class="hk" data-h="${p.id}" ${m&&m.hl>0?"":"disabled style=opacity:.35"}>🔓 HACK</button>`:""}</div>`).join("")}
function render(){const A=$("#app");document.body.classList.toggle("big",isHost);
if(scr==="home"){A.innerHTML=`<h1>CYBER ARENA</h1><div class="sub">معركة الـ Three-Tier • بكالوريا 🔥</div>
<div class="card"><div class="avs">${AVS.map(a=>`<span class="av ${a===me.av?"on":""}" data-a="${a}">${a}</span>`).join("")}</div>
<input id="nm" maxlength="14" placeholder="اسمك في الساحة" value="${esc(me.n)}"><input id="cd" inputmode="numeric" maxlength="4" placeholder="كود الغرفة (4 أرقام)" style="direction:ltr;text-align:center;letter-spacing:6px">
<div class="err" id="er">${esc(err)}</div><button class="btn" id="jn" ${db?"":"disabled"}>⚔️ ادخل المعركة</button></div>
<button class="btn alt" id="ho" ${db?"":"disabled"}>🎙 أنا المدرّسة — افتح غرفة</button>
<div class="card sub">جاوب صح = نقط + سرعة • 3 إجابات ورا بعض = 🔓 Hack تخطف بيه 25% من نقط أي لاعب • 4 ورا بعض = 🛡 درع • آخر دقيقة النقط ×2</div>`;
document.querySelectorAll(".av").forEach(e=>e.onclick=()=>{me.av=e.dataset.a;document.querySelectorAll(".av").forEach(x=>x.classList.toggle("on",x===e))});
$("#jn").onclick=join;$("#ho").onclick=host}
else if(scr==="lobby"){A.innerHTML=isHost?`<h1>CYBER ARENA</h1><div class="sub">كود الغرفة — خلّي الطلاب يفتحوا نفس اللينك ويكتبوه</div><div class="code">${code}</div>
<div class="card"><div class="sub">مدة المعركة</div><select id="du"><option value="5">5 دقايق</option><option value="8" selected>8 دقايق</option><option value="12">12 دقيقة</option></select>
<div id="pl"></div><button class="btn" id="st">🚀 ابدأ المعركة</button></div>`:`<h1>CYBER ARENA</h1><div class="code">${code}</div><div class="sub">استنى المدرّسة تبدأ… جهّز نفسك 😎</div><div class="card" id="pl"></div>`;
if(isHost)$("#st").onclick=()=>{hostSet({status:"playing",endAt:Date.now()+(+$("#du").value)*60000})}}
else if(scr==="play"&&isHost){A.innerHTML=`<h1>LIVE ARENA</h1><div class="hud"><span class="chip" id="clk"></span><button class="btn red" id="en" style="width:auto;padding:8px 16px;font-size:15px">⛔ إنهاء</button></div><div class="card" id="lb"></div><div class="card feed" id="fd" style="font-size:18px"></div>`;
$("#en").onclick=()=>hostSet({status:"ended"})}
else if(scr==="play"){A.innerHTML=`<div class="hud"><span class="chip">${me.av} ${esc(me.n)}</span><span class="sc" id="msc">0</span><button class="chip" id="hkb" style="color:var(--r)">🔓 <span id="mhk">0</span></button><span class="chip">🛡 <span id="msh">0</span></span></div>
<div class="hud" style="margin-top:8px"><span class="lvl" id="lv"></span><span class="chip" id="clk"></span><span class="chip" id="rk"></span></div><div class="bar"><i id="tb"></i></div><div class="card" id="qa"></div><div class="feed" id="fd"></div><button class="btn alt" id="lbb">🏆 الترتيب</button>`;
$("#hkb").onclick=()=>openLB(true);$("#lbb").onclick=()=>openLB(false)}
else if(scr==="end"){const L=calc(),i=L.findIndex(x=>x.id===me.id);A.innerHTML=`<h1>GAME OVER</h1><div class="sub">${isHost?"النتيجة النهائية":i>=0?`مركزك: <span class="tag">#${i+1}</span> بـ ${L[i].sc} نقطة`:""}</div><div class="card">${L.slice(0,3).map((p,k)=>`<div class="row"><span style="font-size:30px">${["🥇","🥈","🥉"][k]}</span><span style="font-size:26px">${p.av}</span><b>${esc(p.n)}</b><span class="s">${p.sc}</span></div>`).join("")}</div><div class="card">${lbHtml(30)}</div><button class="btn" onclick="location.reload()">🔄 جولة جديدة</button>`}
refresh()}
function refresh(){const L=calc();
if(scr==="lobby"&&$("#pl")){$("#pl").innerHTML=L.length?L.map(p=>`<span class="pl">${p.av} ${esc(p.n)}</span>`).join(""):'<div class="sub">مستنيين اللاعبين…</div>';if(isHost)$("#st").disabled=!L.length}
if(scr==="play"){const f=$("#fd");if(f)f.innerHTML=feedHtml();const l=$("#lb");if(l)l.innerHTML=lbHtml(12);
const m=L.find(x=>x.id===me.id);if(m&&!isHost){$("#msc").textContent=m.sc;$("#mhk").textContent=m.hl;$("#msh").textContent=m.sl;$("#rk").textContent="#"+(L.indexOf(m)+1)}
const o=$("#ovl");if(o)o.querySelector("#ol").innerHTML=lbHtml(50,true),bindHk()}}
function openLB(h){closeLB();const d=document.createElement("div");d.className="ov";d.id="ovl";d.innerHTML=`<h1>${h?"🔓 اختار ضحيتك":"🏆 الترتيب"}</h1><div class="sub">${h?"هتخطف 25% من نقطه — لو معاه 🛡 الهجوم هيتصدّ":""}</div><div id="ol"></div><button class="btn alt" style="margin-top:12px" id="cl">رجوع للمعركة</button>`;document.body.appendChild(d);$("#cl").onclick=closeLB;refresh()}
function closeLB(){const o=$("#ovl");if(o)o.remove()}
function bindHk(){document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>doHack(b.dataset.h))}
function flash(t,c){const d=document.createElement("div");d.className="fl "+c;d.innerHTML=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300);if(c==="r"){try{navigator.vibrate&&navigator.vibrate([150,60,150])}catch(e){}document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),420)}}
const pd=()=>({n:me.n,av:me.av,pts:me.pts,st:me.st,hk:me.hk,sh:me.sh});
function broadcast(){const m={t:"s",room,players,hacks,now:Date.now()};conns.forEach(c=>{try{c.open&&c.send(m)}catch(e){}});applyS(m)}
function hostSet(o){room={...room,...o};broadcast()}
function applyS(m){off=m.now?m.now-Date.now():0;room=m.room||room;players=m.players||{};const nh=m.hacks||[];
nh.forEach(h=>{const k=h.t+h.from;if(!seenH.has(k)){seenH.add(k);if(synced&&h.to===me.id)flash(h.blk?"🛡 صدّيت هجوم<br>"+esc(h.fn):"☠ اتهكّرت!<br>−"+h.amt+" من "+esc(h.fn),h.blk?"g":"r")}});synced=true;hacks=nh;
if(room.status==="playing"&&scr==="lobby"){if(isHost){scr="play";render();startTick()}else startPlay()}
if(room.status==="ended"&&scr!=="end"&&scr!=="home")finish();refresh()}
async function doHack(tid){const L=calc(),m=L.find(x=>x.id===me.id),t=L.find(x=>x.id===tid);if(!m||!t||m.hl<=0)return;if(t.sc<=0)return flash("سكوره صفر! اختار حد تاني","y");
const blk=t.sl>0,amt=blk?0:Math.min(t.sc,Math.max(30,Math.floor(t.sc*.25))),h={from:me.id,to:tid,fn:me.n,tn:t.n,amt,blk,t:Date.now()};closeLB();
if(conn&&conn.open){conn.send({t:"h",h});hacks.push(h);seenH.add(h.t+h.from);refresh();flash(blk?"🛡 عنده درع!<br>الـ Hack ضاع":"🔓 HACK ناجح!<br>+"+amt+" نقطة 😈",blk?"y":"g")}else flash("الاتصال مقطوع","y")}
function seterr(m){const e=$("#er");if(e)e.textContent=m}
function join(){me.n=$("#nm").value.trim();code=$("#cd").value.trim();if(!me.n)return seterr("اكتب اسمك");if(code.length!==4)return seterr("الكود 4 أرقام");
try{localStorage.setItem("ca_name",me.n)}catch(e){}
seterr("بيتوصّل…");let ok=false;peer=new Peer();
peer.on("open",()=>{conn=peer.connect(HP+code,{reliable:true});const to=setTimeout(()=>{if(!ok){seterr("الكود غلط أو المدرّسة لسه مفتحتش الغرفة ❌");try{peer.destroy()}catch(e){}}},10000);
conn.on("open",()=>{ok=true;clearTimeout(to);conn.send({t:"p",id:me.id,d:pd()});scr="lobby";render()});
conn.on("data",d=>{if(d.t==="s")applyS(d)});
conn.on("close",()=>{if(scr!=="end")flash("الاتصال اتقطع ⚠️<br>اعمل Refresh","y")})});
peer.on("error",e=>{if(!ok)seterr("مشكلة اتصال ("+e.type+")")})}
function host(){code=String(1000+Math.random()*9000|0);isHost=true;room={status:"lobby"};peer=new Peer(HP+code);
peer.on("open",()=>{scr="lobby";render()});
peer.on("error",e=>{if(e.type==="unavailable-id")host();else{isHost=false;seterr("مشكلة اتصال ("+e.type+")")}});
peer.on("connection",c=>{conns.push(c);c.on("open",()=>c.send({t:"s",room,players,hacks,now:Date.now()}));
c.on("data",d=>{if(d.t==="p")players[d.id]=d.d;else if(d.t==="h")hacks.push(d.h);broadcast()});c.on("close",()=>{conns=conns.filter(x=>x!==c)})})}
function save(){if(!isHost&&conn&&conn.open)conn.send({t:"p",id:me.id,d:pd()})}
function startPlay(){order=[1,2,3].flatMap(l=>shuf(Q.filter(q=>q[0]===l)));qi=0;lastLvl=0;scr="play";render();startTick();nextQ()}
function startTick(){clearInterval(ticker);ticker=setInterval(()=>{const left=(room.endAt||0)-N(),c=$("#clk");if(c){const s=Math.max(0,left/1000|0);c.innerHTML=`⏱ ${s/60|0}:${String(s%60).padStart(2,"0")}${left<60000?' <span class="tag">×2</span>':""}`}
if(room.endAt&&left<=0&&scr==="play"){finish();return}
if(!isHost&&cur&&!locked){const r=QT-(Date.now()-t0)/1000;$("#tb")&&($("#tb").style.width=Math.max(0,r/QT*100)+"%");if(r<=0)answer(-1)}},100)}
function nextQ(){if(scr!=="play"||isHost)return;if(N()>=room.endAt)return finish();if(qi>=order.length)order=order.concat(shuf(Q.filter(q=>q[0]===3)));
const q=order[qi++],perm=q[2].length===2?[0,1]:shuf([0,1,2,3]);cur={q,perm};locked=false;const lv=Math.min(3,q[0]);$("#lv").textContent="LEVEL "+lv+" • "+LV[lv];
const draw=()=>{t0=Date.now();$("#qa").innerHTML=`<div class="q">${esc(q[1])}</div>`+perm.map(i=>`<button class="ans" data-i="${i}">${esc(q[2][i])}</button>`).join("");document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.i))};
if(lv!==lastLvl){lastLvl=lv;locked=true;$("#qa").innerHTML=`<h1 style="font-size:30px">LEVEL ${lv}</h1><div class="sub">${LV[lv]} 🔥</div>`;setTimeout(()=>{locked=false;draw()},1400)}else draw()}
function answer(i){if(locked||!cur)return;locked=true;const q=cur.q,ok=i===q[3],left=Math.max(0,QT-(Date.now()-t0)/1000),x2=room.endAt-N()<60000;
document.querySelectorAll(".ans").forEach(b=>{if(+b.dataset.i===q[3])b.classList.add("ok");else if(+b.dataset.i===i)b.classList.add("bad");b.disabled=true});
if(ok){const g=Math.round((100+50*left/QT)*(x2?2:1));me.pts+=g;me.st++;me.ca++;let m="+"+g;if(me.st%3===0){me.hk++;m+=" 🔓 +Hack!"}if(me.st%4===0){me.sh++;m+=" 🛡 +درع!"}if(me.st>=2)m+=" 🔥x"+me.st;
$("#fd").innerHTML=`<div class="tag" style="font-size:20px">${m}</div>`}else{me.st=0;$("#fd").innerHTML=`<div class="x" style="font-size:18px">${i<0?"الوقت خلص ⏱":"غلط ❌"} — الستريك اتصفّر</div>`}
save();setTimeout(nextQ,1100)}
function finish(){clearInterval(ticker);closeLB();scr="end";render()}
</script></body></html>
